[project]
name = "cisc820-project2"
version = "0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["inside", "outside"]
testpaths = ["inside/tests", "outside/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["derivatives", "functions"]
